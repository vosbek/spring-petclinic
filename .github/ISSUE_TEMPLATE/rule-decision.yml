name: Rule decision
description: Accept or reject a proposed guard rule. A workflow turns this into a pull request for the rules' code owner.
title: "Rule decision"
labels: ["rule decision"]
body:
  - type: markdown
    attributes:
      value: The rules page fills in the rule and the decision. Say why; it goes into the pull request and stays in the history.
  - type: input
    id: rule
    attributes:
      label: Rule
      description: The id of a proposed rule in .cartographer/guardrails.proposed.json
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Decision
      options:
        - Accept
        - Reject
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: What you weighed. For an acceptance, the evidence from history is added to the pull request for you.
    validations:
      required: true
