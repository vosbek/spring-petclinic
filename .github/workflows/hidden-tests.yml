# Hidden tests: behaviour checks agents cannot read. They live in a private repository (vars.HIDDEN_TESTS_REPO)
# checked out with the HIDDEN_TESTS_TOKEN secret. The log and the comment show counts and failing requirement
# titles only; full details go to an issue in the private repository (HIDDEN_TESTS_REPORT_TOKEN). The checkout
# is deleted before the job ends. Make "hidden-tests" required. Without the token it fails, unless a person sets
# vars.HIDDEN_TESTS_OPTIONAL to true while onboarding. Residual risk: the tests run with the pull request's code, which
# can read them during the run; building first and testing the built artifact from the base branch closes that.
name: Hidden tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  hidden-tests:
    runs-on: ubuntu-latest
    env:
      HIDDEN_REPO: ${{ vars.HIDDEN_TESTS_REPO }}
      # A person may set this while onboarding, before the private repository exists. Unset, a missing token fails.
      OPTIONAL: ${{ vars.HIDDEN_TESTS_OPTIONAL }}
    steps:
      - name: Configured?
        id: cfg
        env:
          TOKEN: ${{ secrets.HIDDEN_TESTS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$HIDDEN_REPO" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$OPTIONAL" = "true" ]; then echo "::warning::Hidden tests are not configured and vars.HIDDEN_TESTS_OPTIONAL is true, so nothing was checked."; exit 0; fi
          echo "::error::Hidden tests are not configured (HIDDEN_TESTS_TOKEN, vars.HIDDEN_TESTS_REPO), so this change was not checked against them."
          exit 1
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The gate, from the base branch
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gate
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Install before the hidden tests are on disk, with the base branch's setup script, so nothing the pull request
      # changed runs while they can be read during setup.
      - if: steps.cfg.outputs.ok == 'true'
        run: |
          echo ".gate/" >> .git/info/exclude
          if [ -f .gate/.fence/setup.sh ]; then bash .gate/.fence/setup.sh; else bash .fence/setup.sh; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          repository: ${{ env.HIDDEN_REPO }}
          token: ${{ secrets.HIDDEN_TESTS_TOKEN }}
          path: .hidden-tests
          persist-credentials: false
      - name: Run (counts and requirement titles only)
        id: run
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set +e
          bash .hidden-tests/run.sh "$RUNNER_TEMP/hidden.json" > /dev/null 2>&1
          node .hidden-tests/bin/summarize.mjs "$RUNNER_TEMP/hidden.json" > "$RUNNER_TEMP/summary.txt"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/summary.txt"
      - name: Full details to the private repository
        if: steps.cfg.outputs.ok == 'true' && steps.run.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.HIDDEN_TESTS_REPORT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SITE: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then exit 0; fi
          node .hidden-tests/bin/details.mjs "$RUNNER_TEMP/hidden.json" > "$RUNNER_TEMP/details.md"
          title="$SITE#$PR: hidden test failures"
          n=$(gh issue list --repo "$HIDDEN_REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --repo "$HIDDEN_REPO" --body-file "$RUNNER_TEMP/details.md"; else gh issue create --repo "$HIDDEN_REPO" --title "$title" --body-file "$RUNNER_TEMP/details.md"; fi
      - name: Remove the hidden tests
        if: always()
        run: rm -rf .hidden-tests "$RUNNER_TEMP/hidden.json" "$RUNNER_TEMP/details.md"
      - name: Verdict
        if: steps.cfg.outputs.ok == 'true'
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: test "$CODE" = "0"
