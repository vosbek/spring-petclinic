<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1419; --ink-2:#2B323C; --ink-3:#4A5260; --muted:#5A6472; --faint:#6B7380;
  --line:#E2E5EA; --line-2:#D5DAE1; --subtle:#F7F8FA; --hover:#EEF1F5;
  --blue:#0047BB; --blue-ink:#003A99; --blue-tint:#E6EDFA; --blue-wash:#F3F7FE; --blue-line:#B8CCF0; --blue-2:#5B86D6; --blue-3:#A9C0EA;
  --hi-fg:#9F1C14; --hi-bg:#FDECEA; --md-fg:#8A3B0A; --md-bg:#FDF1E7; --lo-fg:#2B323C; --lo-bg:#EEF1F5;
  --warm:#9A3412; --warm-dot:#C2410C; --warm-wash:#FFF8F2; --warm-line:#F1D7C2;
  --add:#1F6F43; --del:#9F1C14;
  --sans:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:22px;line-height:1.25;letter-spacing:-.015em}
h2{font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{flex:0 0 232px;background:var(--subtle);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.repo-card{border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.repo-card .k{font-size:12px;color:var(--muted)}.repo-card .v{font-weight:600;word-break:break-word}
.navgroup{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.navgroup .eyebrow{padding:0 8px 6px}
.navlink{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:5px;color:var(--ink-2)}
.navlink:hover{background:var(--hover);color:var(--ink)}
.navlink[aria-current]{background:var(--blue-tint);color:var(--blue);font-weight:600}
.navlink .count{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.side-foot .behind{color:#8A4B08;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--warm-dot);display:inline-block;flex:0 0 8px}
/* top bar */
.mainwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 32px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--muted)}.crumbs a:hover{color:var(--ink)}.crumbs .sep{color:#9AA1AC}.crumbs .cur{color:var(--ink)}
.searchbtn{flex:1 1 280px;max-width:520px;margin-left:auto;height:36px;border:1px solid var(--line-2);border-radius:6px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;color:var(--faint);font-size:13px;cursor:pointer;text-align:left}
.searchbtn:hover{border-color:#B8BFC9}
.kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;background:var(--subtle)}
.btn{height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:6px;background:#fff;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#B8BFC9;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.btn.primary:hover{background:var(--blue-ink);color:#fff}
.iconbtn{width:32px;height:32px;padding:0;justify-content:center}
main{padding:24px 32px 56px;display:flex;flex-direction:column;gap:24px;width:100%;max-width:1280px}
/* primitives */
.lede{margin:0;max-width:780px;font-size:15px;line-height:1.6;color:var(--ink-2)}
.sub{margin:0;font-size:14px;color:var(--ink-3)}
.muted{color:var(--muted)}.small{font-size:12px}.s13{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 12px}
.cols{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.col-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:28px}
.col-side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px}
.section{display:flex;flex-direction:column;gap:10px}
.box{border:1px solid var(--line);border-radius:8px;background:#fff}
.box.pad{padding:12px 16px}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line)}
.rowlink{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;color:var(--ink)}
.rowlink:hover{background:var(--subtle);color:var(--ink)}
.pill{display:inline-flex;align-items:center;font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 8px;background:#fff;white-space:nowrap}
.pill.blue{color:var(--blue);background:var(--blue-tint);border-color:transparent;font-weight:500}
.pill.gray{background:var(--hover);border-color:transparent;font-weight:500}
.sev{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border-radius:4px;padding:2px 6px;white-space:nowrap;display:inline-block}
.sev.high{color:var(--hi-fg);background:var(--hi-bg)}.sev.medium{color:var(--md-fg);background:var(--md-bg)}.sev.low{color:var(--lo-fg);background:var(--lo-bg)}
.kind{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border-radius:4px;padding:1px 6px;color:var(--ink-2);background:var(--hover);white-space:nowrap}
.kind.gotcha{color:var(--md-fg);background:var(--md-bg)}.kind.invariant{color:var(--hi-fg);background:var(--hi-bg)}.kind.entry-point{color:var(--blue);background:var(--blue-tint)}
.num{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));border:1px solid var(--line);border-radius:8px}
.stat{padding:16px 20px;display:flex;flex-direction:column;gap:4px;box-shadow:inset -1px 0 0 var(--line)}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .k,.stat .s{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--hover);border-radius:2px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--blue);border-radius:2px}
.bar.t6{height:6px}
.numcircle{flex:0 0 24px;height:24px;border-radius:12px;border:1px solid var(--blue-line);color:var(--blue);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:#fff}
.numcircle.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);border:1px solid var(--line-2);background:#fff;border-radius:5px;padding:3px 10px}
a.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.ext{background:var(--subtle)}
.riskdot{width:6px;height:6px;border-radius:3px;background:var(--warm-dot);display:inline-block}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--subtle);text-align:left;padding:9px 16px;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.t td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:top}
.t tr:hover td{background:var(--subtle)}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;padding:2px;background:var(--subtle)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:4px;background:transparent;font-size:13px;color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 0 0 1px var(--line-2);font-weight:600;color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{height:40px;padding:0 12px;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--ink-3);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-selected=true]{font-weight:600;color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.tabs .c{font-size:11px;color:var(--ink-3);background:var(--hover);border-radius:8px;padding:0 6px}
.filterchips{display:flex;gap:6px;flex-wrap:wrap}
.filterchips button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-2);background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.filterchips button[aria-pressed=true]{border-color:var(--blue);background:var(--blue-tint);color:var(--blue);font-weight:600}
.filterchips .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.filterchips button[aria-pressed=true] .n{color:var(--blue)}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 16px;border:1px solid var(--warm-line);background:var(--warm-wash);border-radius:8px}
.callout.text{display:block;line-height:1.6}.callout.text code{padding:1px 6px}
.callout.info{border-color:var(--blue-line);background:var(--blue-wash)}
.callout code{background:#fff;border:1px solid var(--warm-line);border-radius:6px;padding:6px 10px;color:var(--ink-2)}
.empty{padding:28px 20px;color:var(--ink-3);font-size:13px}
dl.facts{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;padding:8px 16px}
dl.facts dt{font-size:12px;color:var(--muted)}dl.facts dd{margin:0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
dl.facts dd small{font-size:12px;font-weight:500;color:var(--ink-3)}
.spark{display:flex;align-items:flex-end;gap:3px;height:40px}.spark span{flex:1 1 0;border-radius:2px 2px 0 0;background:var(--blue-3)}
.spark span.cur{background:var(--blue)}
.ownrow{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.ownrow .name{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deprow{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink);padding:3px 0}
.deprow:hover{color:var(--blue)}
.deprow .l{color:var(--muted);text-align:right}
/* architecture */
.archmap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lane{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:-1px}
.lane.external{background:var(--subtle)}
.lane-h{flex:0 0 148px;padding:16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--hover)}
.lane-h .d{font-size:12px;color:var(--muted)}
.lane-b{flex:1 1 320px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(208px,100%),1fr));gap:12px}
.node{text-align:left;cursor:pointer;background:#fff;border:1px solid var(--line-2);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:92px;transition:opacity .12s,border-color .12s}
.node:hover{border-color:var(--blue)}
.node.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);background:var(--blue-wash)}
.node.rel{border-color:var(--blue)}
.node.dim{opacity:.5}
.node .nm{font-size:14px;font-weight:600}.node .kd{font-size:12px;color:var(--muted)}
.node .mt{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.node .rel-tag{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-tint);border-radius:4px;padding:1px 6px;white-space:nowrap}
.node .rk{font-size:11px;font-weight:600;color:var(--md-fg);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;padding:10px 16px;border-top:1px solid var(--line);background:var(--subtle);font-size:12px;color:var(--ink-3);align-items:center}
.panel>div{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.panel>div:last-child{border-bottom:0}
.filter-in{height:32px;border:1px solid var(--line-2);border-radius:6px;padding:0 10px;font:inherit;font-size:13px;min-width:200px}
.filter-in:focus{outline:2px solid var(--blue);outline-offset:-1px}
/* code */
.codecard{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
.codehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--subtle)}
.codehead .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.codewhy{margin:0;padding:12px 16px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.codebody{tab-size:4;-moz-tab-size:4;overflow-x:auto;padding:10px 0;font-family:var(--mono);font-size:13px;line-height:22px}
.cl{display:flex;min-width:max-content}
.cl.ann{background:var(--blue-wash)}.cl.on{background:#DCE7FB}
.gut{flex:0 0 64px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:14px;color:var(--faint);user-select:none;font-variant-numeric:tabular-nums}
.mk{width:16px;height:16px;border-radius:8px;background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);font-family:var(--sans);font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.cl.on .mk{background:var(--blue);color:#fff}
.src{white-space:pre;padding-right:16px}
.tk-k{color:#0047BB}.tk-s{color:#8A4B08}.tk-c{color:#5A6472;font-style:italic}.tk-a{color:#5B3FA8}.tk-n{color:#8A4B08}
.anns{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.anns button{width:100%;text-align:left;border:0;background:#fff;padding:12px 16px;display:flex;gap:12px;cursor:pointer;border-top:1px solid var(--hover)}
.anns li:first-child button{border-top:0}
.anns button:hover{background:var(--subtle)}.anns button[aria-pressed=true]{background:var(--blue-wash)}
.anns .badge{flex:0 0 20px;height:20px;border-radius:10px;background:var(--blue-tint);color:var(--blue);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.anns button[aria-pressed=true] .badge{background:var(--blue);color:#fff}
.drift{font-size:12px;font-weight:500;border-radius:4px;padding:1px 8px}
.drift.fresh{color:var(--add);background:#E9F5EE}.drift.moved{color:var(--ink-2);background:var(--hover)}.drift.stale,.drift.missing{color:var(--md-fg);background:var(--md-bg)}
/* flows */
.lanepath{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--subtle)}
.lanepath .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.steps button{width:100%;text-align:left;border:0;background:#fff;padding:14px 16px;display:flex;gap:12px;cursor:pointer}
.steps button:hover{background:var(--subtle)}.steps button[aria-pressed=true]{background:var(--blue-wash)}
/* changes */
.chart{display:flex;gap:10px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:160px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.plot{height:160px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid #C9CED6;background:linear-gradient(var(--hover),var(--hover)) 0 0/100% 1px no-repeat,linear-gradient(var(--hover),var(--hover)) 0 50%/100% 1px no-repeat}
.plot .b{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.plot .b span:first-child{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.plot .b span:last-child{width:100%;max-width:44px;background:var(--blue-2);border-radius:3px 3px 0 0}
.plot .b.peak span:last-child{background:var(--blue)}
.xax{display:flex;gap:6px;font-size:11px;color:var(--muted)}.xax span{flex:1 1 0;text-align:center}
.minis{display:flex;align-items:flex-end;gap:2px;height:20px;width:120px}.minis span{flex:1 1 0;border-radius:1px;background:#8FA3BF}
.minis.hot span{background:var(--warm-dot)}
.up{color:var(--warm);font-weight:600}.down{color:var(--blue);font-weight:600}.flat{color:var(--ink-2);font-weight:600}
/* palette */
dialog.pal{border:1px solid var(--line-2);border-radius:10px;padding:0;width:min(640px,calc(100vw - 32px));box-shadow:0 16px 48px rgba(15,20,25,.18);margin-top:12vh}
dialog.pal::backdrop{background:rgba(15,20,25,.28)}
.pal input{width:100%;height:48px;border:0;border-bottom:1px solid var(--line);padding:0 16px;font:inherit;font-size:15px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:min(60vh,480px);overflow-y:auto}
.pal li button{width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px 10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.pal li button[aria-selected=true]{background:var(--blue-tint)}
.pal .ty{flex:0 0 78px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.pal .nm{font-weight:500}.pal .ds{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;max-width:45%}
.pal .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* matrix */
.t.matrix{width:auto;border-collapse:separate;border-spacing:3px;font-size:12px;margin:4px}
.t.matrix th{background:#fff;padding:0 10px 0 4px;text-align:right}
.t.matrix th.mx-col{height:130px;vertical-align:bottom;padding:0 0 6px;width:36px;text-align:center}
.matrix th.mx-col span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:500;color:var(--ink-2);max-height:118px;overflow:hidden;text-overflow:ellipsis}
.t.matrix td.mx{width:36px;height:32px;padding:0;text-align:center;vertical-align:middle;border:0;border-radius:3px;background:var(--subtle);color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.t.matrix td.mx.self{background:repeating-linear-gradient(45deg,#F7F8FA,#F7F8FA 3px,#EEF1F5 3px,#EEF1F5 6px)}
.t.matrix td.mx.unmodeled{box-shadow:inset 0 0 0 2px #0F1419}
.t.matrix tr:hover td.mx{filter:brightness(.97)}
/* signals */
.sig{display:flex;gap:12px;align-items:flex-start;padding:12px 16px}
.sigmark{flex:0 0 10px;height:10px;border-radius:2px;margin-top:6px}
.sig-hi{background:#B42318;color:#fff}.sig-md{background:#C2410C;color:#fff}.sig-lo{background:#C9CED6;color:var(--ink)}
.sigkind{flex:0 0 auto;margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sigcount{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.sigcount.sig-hi{background:var(--hi-bg);color:var(--hi-fg)}.sigcount.sig-md{background:var(--md-bg);color:var(--md-fg)}.sigcount.sig-lo{background:var(--hover);color:var(--ink-2)}
.size{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;background:var(--hover);color:var(--ink-2)}
.size-L,.size-XL{background:var(--md-bg);color:var(--md-fg)}
/* review guide */
.frow{display:flex;gap:12px;align-items:flex-start;padding:9px 16px;border-top:1px solid var(--hover)}
.st{flex:0 0 18px;height:18px;border-radius:3px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;background:var(--hover);color:var(--ink-2);margin-top:1px}
.st-A{background:#E9F5EE;color:var(--add)}.st-D{background:var(--hi-bg);color:var(--hi-fg)}.st-R{background:var(--blue-tint);color:var(--blue)}
.ftag{font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;white-space:nowrap}
.warmtag{background:var(--md-bg);color:var(--md-fg)}.bluetag{background:var(--blue-tint);color:var(--blue)}.graytag{background:var(--hover);color:var(--ink-2)}
.mchip{display:inline-flex;align-items:center;font-size:12px;color:var(--ink-3);border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:2px 8px;min-height:22px}
.mchip.touched{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.mchip.blast{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);font-weight:500}
a.mchip:hover{border-color:var(--blue)}a.mchip.touched:hover{color:#fff}
/* guardrails */
.vrow{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .fix{font-size:13px;color:var(--ink-2)}.vrow .fix b{font-weight:600;color:var(--ink)}
.cov{font-size:11px;font-weight:600;border-radius:4px;padding:1px 7px;white-space:nowrap}
.cov-gap{background:var(--md-bg);color:var(--md-fg)}.cov-part{background:var(--blue-tint);color:var(--blue)}.cov-ok{background:var(--hover);color:var(--ink-2)}
.ok-pill{font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;background:#E9F5EE;color:var(--add)}
.fail-pill{font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;background:var(--hi-bg);color:var(--hi-fg)}
.rate{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:4px 10px;font-size:12px;color:var(--ink-3)}
.rate .bar{height:8px;background:var(--hover);border-radius:4px;overflow:hidden}.rate .bar span{display:block;height:100%;border-radius:4px;background:var(--blue)}
.rate .bar.base span{background:#9AA1AC}
.proof{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.proof-head{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:flex-start;padding:14px 16px;background:var(--subtle);border-bottom:1px solid var(--line)}
.crow{display:grid;grid-template-columns:84px 76px minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 16px;border-top:1px solid var(--hover);font-size:13px}
.crow:first-child{border-top:0}
.otag{font-size:11px;font-weight:600;border-radius:4px;padding:0 6px}.otag.fixed{background:var(--md-bg);color:var(--md-fg)}.otag.reverted{background:var(--hi-bg);color:var(--hi-fg)}
details.cls{border-top:1px solid var(--line)}details.cls:first-child{border-top:0}
details.cls summary{display:flex;gap:12px;align-items:center;padding:11px 16px;cursor:pointer;list-style:none}
details.cls summary::-webkit-details-marker{display:none}
details.cls[open] summary{background:var(--subtle)}
.ruledef{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:8px 16px;font-size:13px;align-items:baseline}
.ruledef .k{color:var(--muted);font-size:12px}
@media (max-width:640px){.ruledef{grid-template-columns:1fr}}
.cmd{font-family:var(--mono);font-size:12px;background:var(--subtle);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--ink-2);display:block;overflow-x:auto;white-space:pre}
/* diff */
.diff .dl{display:flex;min-width:max-content}
.diff .dl.add{background:#EAF6EF}.diff .dl.del{background:#FCEEEC}
.gut2{flex:0 0 46px;text-align:right;padding-right:8px;color:var(--faint);user-select:none;font-variant-numeric:tabular-nums}
.diff .sg{flex:0 0 16px;color:var(--ink-3);user-select:none}
.diff .dl.add .sg{color:var(--add)}.diff .dl.del .sg{color:var(--del)}
.morebtn{margin:6px 16px;border:1px solid var(--line-2);background:#fff;border-radius:6px;height:30px;padding:0 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--sans)}
.morebtn:hover{border-color:var(--blue);color:var(--blue)}
.chipline{display:flex;flex-wrap:wrap;gap:8px}
.sigchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:15px;font-size:13px;color:var(--ink);background:#fff}
a.sigchip:hover{border-color:var(--blue);color:var(--blue)}
.sigchip .dot{width:8px;height:8px}
.cmeta{display:inline-flex;font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;white-space:nowrap}
.cmeta.ai{background:var(--blue-tint);color:var(--blue)}.cmeta.fix{background:var(--md-bg);color:var(--md-fg)}.cmeta.prn{background:var(--hover);color:var(--ink-2)}
@media (max-width:900px){
  .app{flex-direction:column}.side{position:static;height:auto;flex:none;border-right:0;border-bottom:1px solid var(--line)}
  .top,main{padding-left:16px;padding-right:16px}.top{position:static}
}
@media print{.side,.top{display:none}main{max-width:none}}
