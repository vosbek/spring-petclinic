<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartographer · Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1419;--ink-2:#2B323C;--ink-3:#4A5260;--muted:#5A6472;--faint:#6B7380;--line:#E2E5EA;--line-2:#D5DAE1;--subtle:#F7F8FA;--hover:#EEF1F5;
--blue:#0047BB;--blue-ink:#003A99;--blue-tint:#E6EDFA;--blue-2:#5B86D6;--blue-3:#A9C0EA;--warm:#9A3412;--warm-dot:#C2410C;--hi-fg:#9F1C14;--hi-bg:#FDECEA;--md-fg:#8A3B0A;--md-bg:#FDF1E7;
--sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-ink)}button{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
main{padding:24px 32px 56px;max-width:1440px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em}.sub{margin:0;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));border:1px solid var(--line);border-radius:8px}
.stat{padding:14px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:inset -1px 0 0 var(--line)}
.stat .k,.stat .s{font-size:12px;color:var(--muted)}.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{height:34px;border:1px solid var(--line-2);border-radius:6px;padding:0 10px;font:inherit;font-size:13px;min-width:240px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-2);background:#fff;font-size:13px;font-weight:500;cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--blue);background:var(--blue-tint);color:var(--blue);font-weight:600}.chips .n{color:var(--muted);margin-left:4px}
.box{border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px}
th{position:sticky;top:0;background:var(--subtle);text-align:left;padding:9px 12px;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;border-bottom:1px solid var(--line)}
th button{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th[aria-sort] button{color:var(--blue)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}tr:hover td{background:var(--subtle)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.nm{font-weight:600;color:var(--ink)}.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.small{font-size:12px}
.langs{display:flex;height:6px;width:140px;border-radius:3px;overflow:hidden;gap:1px;margin-top:6px}
.pill{display:inline-flex;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.pill.blue{color:var(--blue);background:var(--blue-tint)}.pill.gray{color:var(--ink-2);background:var(--hover)}.pill.warm{color:var(--md-fg);background:var(--md-bg)}.pill.hi{color:var(--hi-fg);background:var(--hi-bg)}
.spark{display:flex;align-items:flex-end;gap:1px;height:18px;width:78px}.spark span{flex:1;background:var(--blue-3);border-radius:1px}
.up{color:var(--warm);font-weight:600}.down{color:var(--blue);font-weight:600}.flat{color:var(--ink-2);font-weight:600}
.flags{display:flex;flex-direction:column;gap:3px}
@media (max-width:700px){.top,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="5" fill="#0047BB"/><path d="M5 7.5 9 5.5l4 2 4-2v9l-4 2-4-2-4 2Z" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 5.5v9M13 7.5v9" stroke="#fff" stroke-width="1.4"/></svg>Cartographer</span>
  <span class="muted" style="font-size:13px">/ Fleet</span>
</header>
<main id="app"></main>
<script id="fleet-data" type="application/json">/*__CARTOGRAPH_FLEET__*/null</script>

  app.appendChild(h('div', { style: 'display:flex;flex-direction:column;gap:4px' }, h('h1', null, D.title), h('p', { class: 'sub' }, R.length + ' repositories · computed from git history, import graphs and models · built ' + new Date(D.builtAt).toLocaleString())));

    rows.sort(function (a, b) { var x = val(a, state.sort), y = val(b, state.sort); if (x == null) x = -1e9; if (y == null) y = -1e9; return (typeof x === 'string' ? x.localeCompare(y) : x - y) * state.dir; });

      }))),

</script>
</body>
</html>
